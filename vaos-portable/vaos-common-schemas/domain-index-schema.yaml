{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "vaos://schemas/domain-index-schema",
  "title": "VAOS Domain Index Schema",
  "description": "Validates domain index files authored from domain-definition.template.yaml.",
  "type": "object",
  "properties": {
    "apiVersion": { "type": "string", "const": "ozco.uva/v1alpha1" },
    "kind": { "type": "string", "const": "DomainDefinition" },
    "metadata": {
      "type": "object",
      "properties": {
        "id": { "type": "string" },
        "name": { "type": "string" },
        "version": { "type": "string" },
        "status": { "type": "string" }
      },
      "required": ["id", "name", "version"]
    },
    "spec": {
      "type": "object",
      "properties": {
        "entities": {
          "type": "array",
          "items": {
            "type": "object",
            "properties": { "id": { "type": "string" }, "name": { "type": "string" } },
            "required": ["id", "name"]
          }
        },
        "relations": { "type": "array" },
        "axioms": { "type": "array" }
      },
      "required": ["entities"]
    }
  },
  "required": ["apiVersion", "kind", "metadata", "spec"],
  "additionalProperties": true
}
