# Base Tools — VA Framework Tool Definitions
# Sourced from: va-tools-creator/SKILL.md + vaos-manifest.yaml
# Framework: VAOS / TheVaGroup | Version: 1.0.0

id: va-base-tools
domain: tools
layer: COMPONENTS
version: "1.0.0"
owner: Senior.Anatoly

description: >
  Fundamental VA tools that every vaos-portable workspace carries.
  All tools conform to the Lambda<Ctx, Usr, Cfg, R> signature and produce
  unit-based output validated by AJV JSON Schema 2020-12.

runtimes:
  base:
    - bun
    - sh
    - pnpm
  optional:
    - uv

base_tools:

  - identity: va-skill-loader
    type: tool
    language: shell
    runtime: sh
    description: Loads a VA skill from the portable bundle and prints its SKILL.md
    entry: tools/va-skill-loader.sh
    args:
      - skill-name

  - identity: va-registry-reader
    type: tool
    language: shell
    runtime: sh
    description: Reads and formats the local VA registry (section filter optional)
    entry: tools/va-registry-reader.sh
    args:
      - section

  - identity: va-unit-validator
    type: tool
    language: shell
    runtime: sh
    description: Validates that input text conforms to the VA unit-output format
    entry: tools/va-unit-validator.sh

  - identity: va-glagol-parser
    type: tool
    language: shell
    runtime: sh
    description: >-
      GlaGol line-oriented parser and symbolic unit builder (UVA): parse,
      classify, lift, metaclose, scaffolds, selftest
    entry: tools/glagol.sh
    args: [command, file]

  - identity: va-kstar-kernel
    type: tool
    language: shell
    runtime: sh
    description: >-
      K* POSIX symbolic self-rewrite kernel: pack, check, step, close, evolve,
      unpack, demo
    entry: tools/kstar.sh
    args: [command, lang, rules, word, max-steps]

  - identity: va-kstar-formal
    type: tool
    language: shell
    runtime: sh
    description: >-
      K* machine-formal self-rewriter with generated termination certificate
      (runs the level-2 lift without SymPy runtime dependency)
    entry: tools/kstar-formal.sh
    args: [run|rules|languages]

  - identity: va-kstar-tests
    type: tool
    language: shell
    runtime: sh
    description: POSIX-sh smoke tests for the K* kernel (hierarchy and closure checks)
    entry: tools/kstar-tests.sh

  - identity: va-glagol-level-2-demo
    type: tool
    language: shell
    runtime: sh
    description: Glagol level-2 scaffold execution demo
    entry: tools/glagol-level-2-demo.sh

  - identity: va-m2m-dev-root-cli
    type: tool
    language: shell
    runtime: sh
    description: >-
      Generated m2m-dev-root-cli-v1 scaffold (M2M-DEV-ROOT development CLI);
      documents command groups, does not implement handlers
    entry: tools/m2m-dev-root-cli.sh

  - identity: va-shell-runner
    type: tool
    language: shell
    runtime: sh
    description: Generic shell command runner with unit output
    entry: tools/va-shell-runner.sh

  - identity: va-template-processor
    type: tool
    language: shell
    runtime: sh
    description: Binds spec + params to VA templates using simple substitution
    entry: tools/va-template-processor.sh

lambda_signature:
  notation: "Lambda<Ctx, Usr, Cfg, R>"
  ctx: "{ registry, validator, log }"
  usr: "{ spec: <Spec> }"
  cfg: "{ <config> }"
  R: "{ unit: UnitResponse, validation: ValidationResult }"

validation:
  every_tool_must:
    - conform_to_va_base_conventions
    - produce_unit_based_output
    - be_deterministic
    - be_domain_isolated
    - be_schema_validated
    - be_registered_in_components
